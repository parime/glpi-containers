# Intégration continue : CI officielle GLPI (GLPI 11), installation et tests sur GLPI 12, chargement
# des classes sur chaque PHP supporté, traductions complètes et exigences de la marketplace.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  generate-ci-matrix:
    name: "Matrice de la CI officielle GLPI"
    uses: "glpi-project/plugin-ci-workflows/.github/workflows/generate-ci-matrix.yml@v1"
    with:
      glpi-version: "11.0.x"

  # Lint, PHP_CodeSniffer, PHP-CS-Fixer, PHPStan (phpstan.neon, contre le vrai cœur GLPI 11),
  # en-têtes de licence, installation, PHPUnit (phpunit.xml), propreté de la désinstallation.
  ci:
    name: "GLPI ${{ matrix.glpi-version }} - php:${{ matrix.php-version }} - ${{ matrix.db-image }}"
    needs: "generate-ci-matrix"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-ci-matrix.outputs.matrix) }}
    uses: "glpi-project/plugin-ci-workflows/.github/workflows/continuous-integration.yml@v1"
    with:
      plugin-key: "dockerinventory"
      glpi-version: "${{ matrix.glpi-version }}"
      php-version: "${{ matrix.php-version }}"
      db-image: "${{ matrix.db-image }}"

  glpi12:
    name: "GLPI 12 : installation, PHPUnit et PHPStan"
    runs-on: ubuntu-latest
    env:
      GLPI12_IMAGE: glpi/glpi:12.0.1
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)

      - name: "Dépendances de développement (sur le runner)"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (SHA pinned)
        with:
          php-version: "8.3"
          coverage: none
          tools: composer

      - name: "Installe les dépendances"
        run: composer install --no-interaction --no-progress --prefer-dist

      - name: "Démarre MariaDB et GLPI 12"
        run: |
          docker network create di-glpi12
          docker run -d --name mariadb --network di-glpi12 \
            -e MARIADB_ROOT_PASSWORD=glpi_password -e MARIADB_DATABASE=glpidb \
            -e MARIADB_USER=glpi_user -e MARIADB_PASSWORD=glpi_password mariadb:11
          for i in $(seq 1 30); do
            docker exec mariadb mariadb-admin ping -h 127.0.0.1 -u root -pglpi_password --silent && break
            sleep 2
          done
          docker run -d --name glpi --network di-glpi12 -e TIMEZONE=Europe/Paris "$GLPI12_IMAGE"
          for i in $(seq 1 12); do
            docker exec glpi php bin/console database:install --db-host=mariadb --db-name=glpidb \
              --db-user=glpi_user --db-password=glpi_password --no-interaction && exit 0
            echo "database:install pas encore prêt (essai $i/12)"
            sleep 5
          done
          exit 1

      - name: "Installe, active, désinstalle puis réinstalle le plugin (sans dépendances de dev)"
        run: |
          docker exec glpi mkdir -p /var/www/glpi/plugins/dockerinventory
          tar cf - setup.php hook.php src front templates locales | \
            docker cp - glpi:/var/www/glpi/plugins/dockerinventory
          docker exec -u root glpi chown -R www-data:www-data /var/www/glpi/plugins/dockerinventory
          c="docker exec -u www-data glpi php bin/console"
          $c plugin:install dockerinventory --username=glpi --no-interaction
          $c plugin:activate dockerinventory --no-interaction
          $c plugin:deactivate dockerinventory --no-interaction
          $c plugin:uninstall dockerinventory --no-interaction
          $c plugin:install dockerinventory --username=glpi --no-interaction
          $c plugin:activate dockerinventory --no-interaction

      # Dépendances de dev APRÈS les commandes console : leur symfony/console entrerait en conflit
      # avec celui de GLPI 12.
      - name: "PHPUnit et PHPStan sur GLPI 12"
        run: |
          tar cf - vendor tests phpunit.xml phpstan.neon phpstan.glpi12.neon .phpstan-bootstrap.php composer.json | \
            docker cp - glpi:/var/www/glpi/plugins/dockerinventory
          docker exec -u root glpi chown -R www-data:www-data /var/www/glpi/plugins/dockerinventory
          docker exec -u www-data glpi sh -c 'cd /var/www/glpi/plugins/dockerinventory && php vendor/bin/phpunit'
          docker exec -u www-data glpi sh -c 'cd /var/www/glpi/plugins/dockerinventory && \
            php vendor/bin/phpstan analyse -c phpstan.glpi12.neon --no-progress --memory-limit=2G'

      - name: "Journal GLPI (en cas d'échec)"
        if: failure()
        run: docker logs glpi --tail 200

  php-compat:
    name: "Chargement des classes : PHP 8.2-8.5 x GLPI 11/12"
    # Les installations réelles tournent sur le seul PHP de l'image GLPI : ce job charge chaque classe
    # héritant d'une classe Compat/Base sous chaque PHP supporté par chaque version de GLPI.
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)

      - name: "Code de GLPI 11 et 12 (images officielles)"
        run: |
          for v in 11.0.12 12.0.1; do
            docker create --name "glpi-$v" "glpi/glpi:$v"
            mkdir -p "/tmp/glpi-$v"
            docker cp "glpi-$v:/var/www/glpi/src" "/tmp/glpi-$v/src"
            docker cp "glpi-$v:/var/www/glpi/vendor" "/tmp/glpi-$v/vendor"
          done

      - name: "Charge les classes du plugin"
        run: |
          status=0
          for combo in "8.2 11.0.12" "8.3 11.0.12" "8.4 11.0.12" "8.5 11.0.12" \
                       "8.3 12.0.1" "8.4 12.0.1" "8.5 12.0.1"; do
            set -- $combo
            docker run --rm -v "$PWD:/p" -v "/tmp/glpi-$2:/g" "php:$1-cli" \
              php /p/.github/scripts/compat-smoke.php /g /p || status=1
          done
          exit $status

  locales:
    name: "Traductions complètes"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)

      - name: "Setup PHP"
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2 (SHA pinned)
        with:
          php-version: "8.2"
          coverage: none
          tools: composer

      - name: "Installe les dépendances et gettext"
        run: |
          composer install --prefer-dist --no-progress --no-interaction
          sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends gettext

      - name: "Régénère le .pot depuis le code"
        run: |
          vendor/bin/extract-locales
          # extract-locales réécrit en_GB.po : on garde la vraie traduction anglaise.
          git checkout -- locales/en_GB.po

      - name: "Le .pot versionné est à jour"
        run: |
          if ! diff <(msgcat --sort-output --no-location locales/dockerinventory.pot | grep -v POT-Creation) \
                    <(git show HEAD:locales/dockerinventory.pot | msgcat --sort-output --no-location - \
                      | grep -v POT-Creation); then
            echo "::error::locales/dockerinventory.pot n'est pas à jour : relancer vendor/bin/extract-locales"
            exit 1
          fi

      - name: "Variantes régionales à jour"
        run: sh .github/scripts/sync-locale-variants.sh --check

      - name: "Chaque langue traduit chaque chaîne"
        run: |
          status=0
          for lang in fr_FR en_GB de_DE es_ES it_IT pt_BR pl_PL; do
            msgfmt -c -o /dev/null "locales/$lang.po" || status=1
            msgmerge --no-fuzzy-matching --quiet -o "/tmp/$lang.po" "locales/$lang.po" locales/dockerinventory.pot
            missing=$(msgattrib --untranslated "/tmp/$lang.po" | grep -c '^msgid "[^"]' || true)
            if [ "$missing" -gt 0 ]; then
              echo "::error::$lang.po : $missing chaîne(s) sans traduction"
              msgattrib --untranslated "/tmp/$lang.po" | grep '^msgid "[^"]'
              status=1
            fi
          done
          exit $status

  marketplace:
    name: "Marketplace GLPI : SQL brut, Twig, lignes de 120 caractères"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7 (SHA pinned)

      - name: "Pas de SQL brut hors installation, pas de nouveau HTML en PHP"
        run: php .github/scripts/check-marketplace-readiness.php

      - name: "Gabarits Twig : lignes de 120 caractères au plus"
        shell: python
        run: |
          import pathlib
          import sys
          long = [f'{p}:{i}' for p in pathlib.Path('templates').rglob('*.twig')
                  for i, line in enumerate(p.read_text(encoding='utf-8').splitlines(), 1) if len(line) > 120]
          if long:
              print('::error::lignes de plus de 120 caractères : ' + ', '.join(long))
              sys.exit(1)

  quality-gate:
    name: "Quality Gate"
    runs-on: ubuntu-latest
    needs: [ci, glpi12, php-compat, locales, marketplace]
    steps:
      - name: "Tous les contrôles sont passés"
        run: echo "OK"
