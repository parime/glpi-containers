name: "💡 Suggestion / Feature request"
description: "Proposer une nouvelle fonctionnalité ou une amélioration · Suggest a new feature or improvement"
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Ce plugin donne une vue en lecture seule sur les conteneurs (Portainer, What's Up Docker, Harbor) : voir ROADMAP.md pour les lots prévus. Il ne modifie jamais rien côté conteneurs.
        This plugin gives a read-only view of containers (Portainer, What's Up Docker, Harbor): see ROADMAP.md for the planned lots. It never changes anything on the container side.

  - type: textarea
    id: problem
    attributes:
      label: "Problème à résoudre · Problem to solve"
      description: "Quel besoin métier ou quelle friction cette suggestion adresse-t-elle ? · What business need or friction does this address?"
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: "Solution proposée · Proposed solution"
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives envisagées · Alternatives considered"
    validations:
      required: false
